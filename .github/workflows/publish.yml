name: publish

# Stage @timedomain/acestudio-tempo-map-calc to npm on a version tag, via npm trusted publishing
# (OIDC): no long-lived token, and provenance is generated automatically. This uses STAGED
# publishing — CI can only queue a release; a maintainer must approve it (with 2FA) from a trusted
# device before it goes live. The package's trusted publisher must be configured as stage-only on
# npmjs.com, so a plain `npm publish` from this workflow is rejected by the registry.

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Unlike a typical JS package, this one compiles the C++ core to WASM, so the release build
      # needs Emscripten (pinned for a reproducible artifact).
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # `npm stage` needs npm >= 11.15.0; the version bundled with Node may be older.
      - run: npm install -g npm@^11.15.0

      - run: npm run build
      - run: npm test
      - run: npm stage publish # public via publishConfig; OIDC handles auth
